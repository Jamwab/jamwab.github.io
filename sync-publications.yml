# Put this file at .github/workflows/sync-publications.yml in your repository.
#
# It runs every night, asks SSRN and Crossref whether you have posted anything
# new, and commits the result. Your site then shows the new paper on its own.
# You can also run it by hand from the Actions tab, button "Run workflow".

name: Sync publications

on:
  schedule:
    - cron: "0 6 * * *"     # 06:00 UTC daily, roughly 1am in Quebec
  workflow_dispatch:         # lets you trigger it manually

permissions:
  contents: write            # needed so the job can commit publications.json

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Look for new publications and refresh citation counts
        env:
          # Optional. A free SerpApi key lets the job read Google Scholar counts.
          # Add it under Settings, Secrets and variables, Actions.
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python3 sync_publications.py

      - name: Commit anything new
        run: |
          if [ -n "$(git status --porcelain publications.json index.html)" ]; then
            git config user.name "publications bot"
            git config user.email "actions@github.com"
            git add publications.json index.html
            git commit -m "Update publications and citation counts"
            git push
            echo "Committed."
          else
            echo "Nothing new today."
          fi
