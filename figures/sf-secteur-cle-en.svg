<text x="4" y="10.64" font-size="8.51" fill="#002147" font-weight="bold">The key sector of the Congolese economy</text>
<text x="4" y="20.75" font-size="6.25" fill="#6F6B62">Real growth, per cent, extractive output against the rest of the economy. The</text>
<text x="4" y="28" font-size="6.25" fill="#6F6B62">extractive sector grows two to six times faster than the rest through 2025, and</text>
<text x="4" y="35.25" font-size="6.25" fill="#6F6B62">makes up more than ninety-eight per cent of goods exports; it employs about</text>
<text x="4" y="42.5" font-size="6.25" fill="#6F6B62">one worker in nine. An asterisk marks a projection.</text>
<text x="4" y="135" font-size="5.45" fill="#6F6B62">IMF country report 26/2, table 1; USGS; ILO.</text>
