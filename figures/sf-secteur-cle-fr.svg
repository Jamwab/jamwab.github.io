<text x='3.99' y='22.99' style='font-size: 8.93px;fill: #6F6B62; font-family: "Liberation Sans";' textLength='1223.73px' lengthAdjust='spacingAndGlyphs'>Croissance réelle, en pourcentage, production extractive contre reste de l’économie. Le secteur extractif croît deux à six fois plus vite que le reste jusqu’en 2025, et fait plus de quatre-vingt-dix-huit pour cent des exportations de biens ; il occupe environ un travailleur sur neuf. L’astérisque signale une projection.</text>
