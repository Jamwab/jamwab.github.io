<text x="4" y="10.07" font-size="7.78" fill="#002147" font-weight="bold">Le secteur clé de l’économie congolaise</text>
<text x="4" y="19.49" font-size="5.72" fill="#6F6B62">Croissance réelle, en pourcentage, production extractive contre reste de l’économie.</text>
<text x="4" y="26.12" font-size="5.72" fill="#6F6B62">Le secteur extractif croît deux à six fois plus vite que le reste jusqu’en 2025, et fait</text>
<text x="4" y="32.74" font-size="5.72" fill="#6F6B62">plus de quatre-vingt-dix-huit pour cent des exportations de biens ; il occupe environ</text>
<text x="4" y="39.37" font-size="5.72" fill="#6F6B62">un travailleur sur neuf. L’astérisque signale une projection.</text>
<text x="4" y="135.72" font-size="4.99" fill="#6F6B62">FMI, rapport pays 26/2, tableau 1 ; USGS ; OIT.</text>
