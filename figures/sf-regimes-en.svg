<text x="4" y="20.75" font-size="6.25" fill="#6F6B62">Real GDP growth, per cent. The colour marks the period and the dashed line</text>
<text x="4" y="28" font-size="6.25" fill="#6F6B62">the average growth of that period, which came to -6.3 per cent in the late</text>
<text x="4" y="35.25" font-size="6.25" fill="#6F6B62">Mobutu years, -5.9 per cent during the war and the transition, 5.8 per cent</text>
<text x="4" y="42.5" font-size="6.25" fill="#6F6B62">during the reconstruction and 5.3 per cent under the present administration.</text>
<text x="4" y="129.33" font-size="5.45" fill="#6F6B62">IMF, World Bank, BCC, AfDB.</text>
<text x="235.78" y="137.73" font-size="5.02" fill="#6F6B62" text-anchor="end">© 2026 James Wabenga Yango</text>
