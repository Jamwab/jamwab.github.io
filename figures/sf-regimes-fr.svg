<text x="4" y="10.07" font-size="7.78" fill="#002147" font-weight="bold">Le cycle réel, par période politique</text>
<text x="4" y="19.49" font-size="5.72" fill="#6F6B62">Croissance du PIB réel, en pourcentage. La couleur marque la période et le trait</text>
<text x="4" y="26.12" font-size="5.72" fill="#6F6B62">discontinu donne la croissance moyenne de cette période, qui a valu -6,3 pour cent à</text>
<text x="4" y="32.74" font-size="5.72" fill="#6F6B62">la fin de la période Mobutu, -5,9 pour cent pendant la guerre et la transition, 5,8 pour</text>
<text x="4" y="39.37" font-size="5.72" fill="#6F6B62">cent pendant la reconstruction et 5,3 pour cent sous l’administration actuelle.</text>
<text x="4" y="130.05" font-size="4.99" fill="#6F6B62">FMI, Banque mondiale, BCC, BAD.</text>
<text x="235.78" y="137.73" font-size="4.59" fill="#6F6B62" text-anchor="end">© 2026 James Wabenga Yango</text>
