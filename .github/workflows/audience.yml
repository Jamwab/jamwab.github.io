# A poser dans .github/workflows/audience.yml.
#
# GitHub tient, pour son propre compte, le releve des pages servies et des
# clonages du depot, mais ne le garde que quatorze jours. Cette action le lit
# chaque nuit et le verse dans data/audience.json, qui, lui, garde tout.
# Le site lit ce fichier : le compteur de la colonne de gauche affiche donc
# des chiffres vrais, dates, obtenus sans service tiers et sans temoin.

name: Journal d'audience

on:
  schedule:
    - cron: "40 4 * * *"     # tous les jours a 04h40 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Relever l'audience et la verser au journal
        id: releve
        continue-on-error: true
        env:
          # Le jeton par defaut suffit si le depot vous appartient. S'il
          # revient en 403, creez un jeton personnel a portee public_repo,
          # posez-le en secret sous le nom AUDIENCE_TOKEN, et il sera pris.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDIENCE_TOKEN: ${{ secrets.AUDIENCE_TOKEN }}
        run: python3 tools/audience.py

      - name: Publier le journal
        if: steps.releve.outcome == 'success'
        run: |
          if [ -z "$(git status --porcelain data/audience.json)" ]; then
            echo "aucun changement"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audience.json
          git commit -m "Journal d'audience"
          git push

      - name: Signaler l'echec sans casser le site
        if: steps.releve.outcome != 'success'
        run: |
          echo "::warning::Le releve d'audience a echoue ; le compteur garde"
          echo "ses derniers chiffres. Si l'erreur est un 403, le jeton par"
          echo "defaut n'a pas acces au releve : posez AUDIENCE_TOKEN en secret."
